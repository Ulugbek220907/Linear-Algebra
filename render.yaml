# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: linear-algebra-companion
    runtime: static
    branch: master
    buildCommand: npm install --include=optional && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /board/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
